services:
  db:
    image: postgres:16
    container_name: researchflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchflow
      POSTGRES_PASSWORD: researchflow
      POSTGRES_DB: researchflow
    ports:
      - "5432:5432"
    volumes:
      - researchflow_pgdata:/var/lib/postgresql/data

volumes:
  researchflow_pgdata: